<script>
const DB={"T":[["Tình yêu & hẹn hò","Love & Dating","❤️",0],["Chia tay & tâm trạng","Heartbreak & Moods","💔",0],["Hôn nhân & gia đình","Marriage & Family","💒",0],["Nàng & chàng","Battle of the Sexes","💬",0],["Tiền bạc & kinh doanh","Money & Business","💰",0],["Công sở & nghề nghiệp","Work & Professions","🖥️",0],["Bác sĩ & sức khỏe","Doctors & Health","🩺",0],["Ăn uống","Food & Drink","🍔",0],["Du lịch & xe cộ","Travel & Cars","🧳",0],["Nhà cửa & đời sống","Home & Daily Life","🏠",0],["Nói lái & chơi chữ","Wordplay","🔤",0],["Troll & châm biếm","Trolls & Insults","🤡",0],["Truyện cười ngớ ngẩn","Zany & Silly Jokes","🤪",0],["Tin đồn & hội thoại","Gossip & Dialogues","🗣️",0],["Lời khuyên & châm ngôn","Advice & Quips","💡",0]],"I":[["b0",4,"Rich people marry for matching status; poor people marry and multiply the hunger.","Người giàu kết đôi thì môn đăng hộ đối, còn người nghèo lấy nhau thì nhân đôi hộ đói.",0,1],["b1",1,"I walked into a shoe store and out again — every pair was beautiful except the two of us.","Bước vào tiệm giày rồi bước ra, đôi nào cũng đẹp trừ đôi ta.",0,1],["b2",0,"I dressed up as a burglar\nand broke into your house.\nGold and silver I took,\nbut you — I left alone.","Tôi đóng giả kẻ trộm\nĐột nhập vào nhà em\nVàng bạc thì tôi lấy\nChỉ riêng em thì không",0,1],["b3",10,"Let's lower the ego of the two of us so our lips can touch the love between them.","Hạ cái tôi của đôi mình để chạm cái tình của đôi môi",0,1],["b4",0,"\"I love you\" is a simple sentence.\n\"I don't love you\" is a life sentence.\nA simple sentence is short; a life sentence is long.","Anh yêu em là câu đơn\nEm không yêu anh là cơn đau\nCâu đơn thì ngắn, cơn đau thì dài",0,1],["b5",11,"- Ma'am, may I swap to the night shift?\n- Someone died on it, dear.\n- My condolences to the family.","- Chị ơi, em xin đổi sang ca tối ạ\n- Tối có người mất rồi em\n- Chia buồn cùng gia đình ạ",0,1],["b6",10,"I skipped my sleep to play the fool — and what an artist of a fool I am.","Tôi kệ cả ngủ để làm trò nghệ cả củ",0,1],["b7",2,"- Mom, am I adopted?\n- If I'd adopted a kid, why on earth would I pick you?","- Mẹ ơi, con có phải con nuôi không?\n- Nếu được nhận nuôi, sao tao phải chọn mày",0,1],["b8",1,"Why mourn? Our names will still share a wedding card — yours on the cover, mine on an inside page.","Tiếc làm gì, sau này tên của anh và em vẫn trong cái thiệp cưới mà. Người thì trang bìa, người thì trang giữa.",0,1],["b9",10,"Tomorrow I'll quit, and then I'll go on working forever. (A crude Vietnamese spoonerism, loosely rendered.)","Mai làm đ* rồi đi làm mãi",0,1],["b10",10,"Misery arrives the moment you're indicted.","Khổ tới vì bị khởi tố",0,1],["b11",1,"She came back only because she missed\nthe old picture frame.","Cô ấy quay lại bởi vì nhớ\nCái khung ảnh cũ",0,1],["b12",11,"I propose our company slogan become: \"Have triplets with Sacombank.\"","Em kiến nghị slogan công ty mình sẽ đổi thành: \"Sanh ba con cùng sacombank\"",0,1],["b13",10,"(A chain of Vietnamese spoonerisms, loosely rendered.)\nThe cheat hates thunder, the lecher hates daylight, the classy hate vinegar, and \"some\" folks hate roaches.","Người gian không thích sấm\nNgười dâm không thích sáng\nNgười sang không thích dấm\nNgười some không thích gián",0,1],["b14",11,"We raided the enemy's grain depot\nand all they had was scorched rice.","Ta đánh vào kho lương của địch\nBên địch chỉ có thóc khét",0,1],["b15",11,"American soldiers hate war movies\nbecause the Vietnamese army produced them.","Lính mỹ ghét phim chiến tranh\nDo bộ đội Việt Nam phát hành",0,1],["b16",11,"Uncle never sat in the driver's seat,\nyet the whole nation saw he was the driver — a man of great talent.","Bác không ngồi ở ghế lái\nNhưng cả dân tộc ai cũng thấy Bác tài",0,1],["b17",0,"Meeting you is like doing math —\nI can solve four types at once.","Gặp em như khi làm toán\nAnh có thể làm bốn dạng liền",0,1],["b18",0,"Let's turn into monkeys together,\nbecause I want to watch us evolve into a married pair.","Muốn cùng em hoá khỉ\nVì tôi muốn thấy đôi mình thành thân",0,1],["b19",2,"We chase after silver and gold, never knowing\nthe silver is in Mom's hair and the golden sun on Dad's shoulders.","Ta đi kiếm bạc, kiếm vàng nhưng đâu hay biết.\nBạc trên tóc mẹ, nắng vàng trên vai ba.",0,1],["b20",10,"- Can I have one part off your bike?\n- Sure.\n- Then I'll take the saddle, and be left in peace.","- Anh cho em 1 bộ phận trên xe anh được không?\n- Ok em\n- Vậy để cho em yên",0,1],["b21",4,"Choosing a lover is like choosing a gift:\ndon't worry about the cost.","Chọn người yêu cũng như chọn quà vậy\nChọn quà đừng lo tốn",0,1],["p1",10,"The deaf don't fear guns; the righteous don't fear circuses.","Điếc không sợ súng - đúng không sợ xiếc.",0,1],["p2",10,"Many love doing good deeds, but few love doing heavy work.","Nhiều người năng làm việc thiện nhưng không thiên làm việc nặng.",0,1],["p3",10,"The rich go to the cabaret; the old go fishing.","Người giàu đi ca, người già đi câu.",0,1],["p4",10,"Hardworking folks become soldiers; slick folks become liars.\nHardworking folks fall ill; slick folks turn violent.\nHardworking folks hold nails; slick folks hold swords.","Người lao động làm lính\nNgười linh động làm láo\nNgười lao động hay bịnh\nNgười linh động hay bạo\nNgười lao động cầm đinh\nNgười linh động cầm đao",0,1],["p5",10,"Saggy skin gets a lift; pinched skin gets tight.","Da nhăn thì kéo ... da nhéo thì căng.",0,1],["p6",0,"- A man can accept a woman who's had one husband, but a woman can't.\n- Because she can't accept a man who's had one husband.","- Đàn ông có thể chấp nhận người phụ nữ có 1 đời chồng nhưng đàn bà thì không\n- Tại vì họ không thể chấp nhận người đàn ông có 1 đời chồng",0,1],["p7",10,"Charm with class — lust with cash. (Spoonerism, loosely rendered.)","Duyên và có tầm - dâm và có tiền",0,1],["p8",10,"Pretty and hard to woo — classy and hard to please.","Xinh và khó tán - sang và khó tính",0,1],["p9",10,"We once touched the high point... now we look at each other like a bad omen.","Từng chạm đến điểm gờ... nhưng giờ xem nhau như điềm gở.",0,1],["p10",2,"I go dreaming in the sky\nwhile Dad hoes the soil, a lifetime not yet done.","Ta đi mơ mộng trên trời\nĐể cha cuốc đất một đời chưa xong",0,1],["p11",1,"You're not a lab rat, so don't try everything.","Không phải chuột bạch đừng có cái gì cũng muốn thử.",0,1],["p12",1,"Why does a broken cup still make a sound, yet people, when they shatter, choose silence?","Tại sao chiếc cốc vỡ còn phát ra tiếng, thế mà con người ta lúc tan nát lại chọn cách im lặng.",0,1],["p13",1,"If silence could turn into water, I would have left an ocean here.","Nếu im lặng có thể biến thành giọt nước, thì có lẽ anh đã bỏ lại đây một đại dương.",0,1],["p15",10,"Crumple the paper, not my heart.","Vò tờ giấy chứ đừng giày vò tớ",0,1],["p16",10,"How can I get through to you, when you can't even see me?","Làm gì để thấu được đây, em có thấy được đâu.",0,1],["p17",10,"I had to make you cry because I fell for someone else.","Phải làm em khóc vì phải lòng em khác.",0,1],["p18",10,"Owe money and you're ill; hold money and you're warm.","Âm tiền thì ốm mà ôm tiền thì ấm",0,1],["p19",0,"Someone slipped into my heart the moment you glanced over and smiled.","Tim anh có người vào khi em ngó vào cười",0,1],["p20",10,"A stubborn-but-compatible love is a reasonable love.","Lỳ hợp tính là mối tình hợp lý.",0,1],["p21",10,"A missed love, a mess of faulty love.","mối tình lỡ - mớ tình lỗi",0,1],["p22",10,"What a strange romance: a goofy, carefree fool in love with a spoiled, heartless one.","Mối tình này lạ nhỉ?\nMột kẻ hâm và vô tư yêu một kẻ hư và vô tâm.",0,1],["p23",0,"Want a woolen scarf? I'll knit one in a bit.","Muốn có khăn len thì tí em đan.",0,1],["p24",0,"I'll wait for you forever,\nand though they call me a fool, I'll stay silly over you for life.","Anh nguyện đợi em dài dài\nDù họ bảo anh ngốc thì anh vẫn dại em đời đời.",0,1],["p27",10,"As if robbed of my paddy, I've no field left to plant.","Như bị cướp mất ruộng, anh chẳng còn ô cấy",0,1],["p28",0,"Your face carries a priceless sadness,\nbecause it holds a golden ratio.","Gương mặt em có một nổi buồn đắt giá\nVì nó chứa 1 tỷ lệ vàng...",0,1],["p29",0,"Love turns into a circus act if you insist on somersaulting.","Tình yêu sẽ trở thành gánh xiếc nếu ta thích \"lộn người\".",0,1],["p30",0,"Since I fell for you even the dike has gone flavorful —\nall I see along it is fish sauce and salt.","Từ ngày yêu em đến con đê cũng trở nên mặn mà\nVì anh thấy đê mắm đê muối.",0,1],["p31",0,"Courting you is like subscribing to premium:\nsadly, I don't have that account.","Tán em giống như đăng ký premium\nTiếc thay, anh không có tài khoản đó.",0,1],["p32",10,"If you don't like me, fine.\nThis love of mine can't be wished beautiful.","Em đã không thích thì thôi\nTình này anh có \"ước cũng chẳng đẹp\".",0,1],["p33",1,"When I had no money nobody answered my calls. Now no one can reach me... because I pawned my phone.","Lúc tao không có tiền gọi không ai bắt máy. Giờ đố thằng nào gọi được tao đấy... vì tao cắm máy rồi.",0,1],["p34",5,"Passion keeps you up late; work makes you get up.","Đam mê là thứ giúp bạn thức khuya, còn công việc là thứ bắt bạn thức dậy.",0,1],["p35",5,"I'm at my most creative when writing my leave request.","Lúc sáng tạo nhất đó là lúc tôi viết đơn xin nghỉ phép.",0,1],["p36",4,"Money can't buy everything, but without money you come up short on everything you buy.","Tiền không mua được tất cả, nhưng thiếu tiền thì mua gì cũng mua thiếu.",0,1],["p37",4,"I'm not poor... I'm pursuing a minimalist lifestyle.","Tôi không nghèo… tôi chỉ đang theo đuổi phong cách sống tối giản.",0,1],["p38",1,"My bed is where I'm most faithful: love at first sight, all the way to the next morning.","Giường là nơi tôi trung thành nhất, yêu từ cái nhìn đầu tiên đến tận sáng hôm sau.",0,1],["p39",1,"Don't judge a person by looks — wait until they wake up and judge the bare face.","Đừng đánh giá một người qua vẻ bề ngoài, hãy chờ họ ngủ dậy xem mặt mộc rồi hãy đánh giá.",0,1],["p40",2,"- Closed any deals since you went into real estate?\n- Lucky me, I sold three of my parents' plots. Now I just need a house at a good price and I'll sell the rest.","- Từ lúc em làm bất động sản chốt được căn nào chưa?\n- Trộm vía em bán được 3 miếng đất của bố mẹ. Bây giờ có cái nhà được giá thì đi nốt.",0,1],["p41",5,"My wife's a teacher and I drive a motorbike taxi. This morning a student paid me 300k to attend his parent-teacher meeting — and it turned out to be my wife's class. Now she thinks I have a secret kid; she won't pick up my calls, and the gate's locked.","Vợ mình là giáo viên, mình chạy xe ôm. Sáng nay đón khách thì có thằng học sinh đến thuê mình 300k đi họp phụ huynh cho nó, nào ngờ vào đúng lớp vợ mình. Giờ vợ tưởng mình có con riêng, gọi điện để giải thích thì không bắt máy, về nhà thì thấy cổng khoá trái rồi.",0,1],["p42",0,"Kid, I'll save you in my contacts as \"motorbike taxi,\" and you save me as \"regular customer.\"","Nhóc ơi, tớ sẽ lưu tên cậu trong danh bạ là xe ôm, còn cậu lưu tớ thành khách hàng thân thiết nhé.",0,1],["p43",1,"My mood is like my wallet: little positive, lots of negative.","Tâm trạng như tiền trong ví: tích cực ít mà tiêu cực nhiều.",0,1],["p44",11,"You're so modest... about your intellect, and so simple... about your smarts.","Bạn thật khiêm tốn... về trí tuệ và giản dị... về thông minh.",0,1],["p45",11,"So that's why your brain is good for something — fertilizer.","Thì ra não bạn rất có ích cho việc bón cây",0,1],["p46",11,"Wisdom keeps chasing you, but you're too fast...","Trí tuệ luôn theo đuổi bạn, nhưng bạn quá nhanh...",0,1],["p47",11,"Talking to you is a real \"can't stay awake\" experience.","Nói chuyện với bạn thấy \"ta không thể ngủ\"",0,1],["p48",1,"A happy child uses childhood to embrace a whole life;\nan unhappy child uses a whole life to heal childhood.","Đứa trẻ hạnh phúc dùng tuổi thơ để ôm ấp cả cuộc đời\nĐứa trẻ bất hạnh dùng cả cuộc đời để chữa lành tuổi thơ.",0,1],["p49",1,"From now on, mountains and rivers will not meet again; I won't ask an old friend how long or short the tale was.","Từ nay sông núi chẳng gặp lại, không hỏi cố nhân chuyện ngắn dài.",0,1],["p50",1,"If life were easy, we wouldn't arrive in this world crying.","Nếu cuộc đời này dễ dàng thì con người đâu đến thế gian này bằng tiếng khóc.",0,1],["p51",1,"We spent our youth polishing each other into perfection, then gave that perfection to whoever came next.","Chúng ta dành cả thanh xuân nắn nót cho nhau hoàn hảo. Rồi dành sự hoàn hảo ấy cho người đến sau.",0,1],["p52",1,"They say looks don't matter, yet they cut down all the weeds and leave just one flower.","Họ bảo nhan sắc không quan trọng nhưng họ lại chặt hết đám cỏ dại và chừa lại một bông hoa.",0,1],["p54",1,"The tastiest part of a cucumber tastes like the worst part of a watermelon.","Phần ngon nhất của trái dưa leo có vị như phần dở nhất của trái dưa hấu.",0,1],["p55",1,"If it isn't the one I wanted, loving anyone is joyless;\nif it isn't the one I waited for, nobody beside me brings peace.","Nếu không phải người mình mong muốn, thì cả đời này yêu ai cũng không vui vẻ\nNếu không phải người mình chờ đợi, thì bên cạnh ai cũng chẳng thấy bình yên.",0,1],["p56",0,"Love should be the lightest thing in life; don't hang a giant ledger of give-and-take on it.","Yêu thương nên là điều nhẹ nhõm nhất trên đời đừng khoác lên mình nó bài tính khổng lồ giữa nhận và cho.",0,1],["p57",0,"A little weak for lack of a little warmth.","Thấy hơi yếu vì thiếu hơi ấy.",0,1],["p58",0,"Loving you wasn't in my plan — I just got stuck.","Yêu em, không nằm trong dự tính, mà do anh tự dính.",0,1],["p59",0,"If you want to laugh for life, just watch me clown around.","Nếu em muốn cười cả đời thì chỉ cần trông anh làm trò",0,1],["p60",0,"I took a blood test today and the doctor said, \"Your blood is catching.\" (A pun on \"marry me\" in Vietnamese.)","Hôm qua anh đi xét nghiệm máu, bác sĩ bảo: \"Máu anh lây\"",0,1],["p61",10,"A love e floor.","Bạn không thể té xuống giường nếu bạn ngủ trên sàn nhà.",0,0,""],["h616",14,"You will never hit the mark if you don't pull the trigger.","Bạn sẽ không bao giờ bắn trung mục tiêu nếu bạn không bấm cò.",0,0,""],["h618",0,"A girl in good shape'\"' is the reason for many men being in bad shape.","Một cô gái có thân hình đẹp là nguyên nhân khiến nhiều đàn ông có thân hình tiều tụy.",0,0,""],["h619",0,"A girl can either go to the mountain and see the scenery or go to the beach and be the scenery.","Một cô gái có thể đi lên nui và ngắm cảnh hoặc đến bài biển và làm cảnh.",0,0,""],["h620",0,"A girl in a car is worth more than five in the phone book.","Một cô gai ở trong xe gia trị hơn 5 cô ở trong sổ điện thoại.",0,0,""],["h621",0,"A girl is getting old when she begins to worry more about how her shoes fit than how her sweater fits.","Một co gai thấy mình gia đi khi co ta bắt đầu than phiền giày của cô ta vừa vặn hơn áo lót của cô.",0,0,""],["h622",0,"A girl wants a man who is smart enough to make a lot of money and stupid enough to give it to her.","Nguci con gai thích người đàn ông đã khôn ngoan làm ra nhiều tiền và vừa đủ dại để đua tiền đó cho nàng.",1,0,""],["h623",0,"A girl who plays with fire seldom strikes a match.","Một cô gái đùa với lửa ít khi bật quẹt.",0,0,""],["h624",0,"Girls' fashions may change but their design remains the same.","Thời trang của bạn gái có thể đổi thấy nhung \"mẫu ma\" của họ vẫn y như cũ.",1,0,""],["h625",0,"To most girls, men are not a problem but a solution.","Đối với hầu hết bạn gái, đàn ông không phải là bài toán mà là một giải pháp.",0,0,""],["h627",0,"When a girl begins to count on a man, his number is up.","Khi một cô gái tin cậy vào một đấng mày râu thì chàng ta đã tới số.",0,0,""],["h628",0,"The girl with a future avoids a man with a past.","Con gái có tương lại tránh đàn ông có quá khứ.",0,0,""],["h629",2,"A wise husband buys his wife such expensive China, she won't trust him to wash the dishes.","Chồng khôn thì mua cho 655",3,"When a man brings flowers to his wife for no reason, there's a reason.","Khi một đang mày râu mang hoa tặng vợ không có lý do, at có lý do đấy.",0,0,""],["h656",3,"When a man drinks, he does it for two reasons : either he has no wife or he has.","Khi người ta nhậu, thế tất có hai lý do : hoặc người ta không có vợ hoặc người ta có vợ.",0,0,""],["h657",4,"By the time you have found the key to success, someone has changed the lock.","Vào lúc mà bạn tìm thấy chiếc chìa khóa dẫn tới thành công thì ai đó đã đồi ổ khoá.",0,0,""],["h658",4,"By the time you have money to burn, the fire has gone out.","Vào lúc mà bạn có tiền đề dốt thì ngọn lừa đa tắt.",0,0,""],["h659",4,"It doesn't matter if you are born poor and die poor, as long as you are rich in between.","Bạn có sanh ra nghèo hay chết nghèo không thành vấn để, miễn là bạn giàu giữa lúc sanh và lúc chết.",0,0,""],["h660",4,"It's easy to make money. It's hard to make a living.","Kiếm ra tiền thì dễ. Sống mới thật là khó.",0,0,""],["h663",4,"Money is like fertilizer ; it's no good unless you spread it around.","Tiền giống như phân bón, nó không có ý nghĩa gì cả trừ khi bạn sử dụng nó.",0,0,""],["h664",4,"Money is not for poor people.","Tiền không vị người nghèo.",0,0,""],["h665",4,"Money is worth so little now that it's surprising that so many people spend so much time working for it.","Hiện nay tiền có giá trị rất nhỏ đến nỗi ta phải ngạc nhiên mà thấy khối người bỏ ra quá nhiều thì giờ để làm ra nó.",0,0,""],["h666",4,"Money isn't important as long as you have it.","Tiền không quần trọng miễn là bạn có nó.",0,0,""],["h667",4,"Money sure talks. But to me it only says goodbye !","Tiền hẳn có tiếng nói. Nhưng đối với tôi, nó chỉ nói lời từ biệt.",0,0,""],["h668",4,"Silence is golden but money talks.","Yên lặng là vàng nhưng tiền là tiếng nói.",0,0,""],["h669",4,"Whether rich or poor, it's nice to have money.","Dù giàu hay nghèo, có tiền vẫn tốt.",0,0,""],["h670",9,"Many people get gray worrying over gray hair.","Nhi
